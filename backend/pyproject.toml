[project]
name = "paylineage"
version = "0.1.0"
description = "PayLineage backend: provenance, mandates, shared policy, bound approvals and protected execution for AI accounts-payable agents"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
authors = [{ name = "Sheikh Robin Emon" }]
dependencies = [
  "fastapi>=0.120",
  "uvicorn[standard]>=0.38",
  "pydantic>=2.12",
  "pydantic-settings>=2.11",
  "sqlalchemy>=2.0.44",
  "alembic>=1.17",
  "psycopg[binary]>=3.2",
  "rfc8785>=0.1.4",
  "wasmtime>=38",
  "jsonschema>=4.25",
  "cryptography>=46",
  "webauthn>=2.7",
  "httpx>=0.28",
  "pdfminer.six>=20250506",
  "itsdangerous>=2.2",
]

[project.optional-dependencies]
# Renders the fictional invoice PDFs for `make seed` and the scenario generator.
seed = ["reportlab>=4.4"]

[project.scripts]
paylineage-api = "paylineage.api.main:run"
paylineage-executor = "paylineage.executor.app:run"
paylineage-mockbank = "paylineage.mockbank.app:run"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/paylineage"]
