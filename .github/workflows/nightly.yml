name: nightly

on:
  schedule: [{ cron: "17 7 * * *" }]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deep:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16.10-alpine
        env: { POSTGRES_USER: paylineage, POSTGRES_PASSWORD: paylineage_dev, POSTGRES_DB: paylineage_test }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U paylineage" --health-interval 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+psycopg://paylineage:paylineage_dev@localhost:5432/paylineage_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - run: uv sync --frozen
      - run: HYPOTHESIS_PROFILE=deep uv run pytest -q
      - run: uv run python -m paylineage.eval.run --tracks B C --extractor adversarial_stub --gate
      - name: Policy mutation testing (hand planted Rego mutants)
        run: ./scripts/install_opa.sh && make policy-mutants
      - name: Python mutation testing (hand planted mutants on the authorization path)
        run: make mutation
