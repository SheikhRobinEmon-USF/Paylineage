name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  sbom:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: "22", cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: CycloneDX SBOMs (Python and Node)
        run: |
          uv export --frozen --no-dev --format requirements-txt > requirements.txt
          uvx cyclonedx-py requirements requirements.txt -o sbom-python.cdx.json
          npx --yes @cyclonedx/cyclonedx-npm@4 --output-file sbom-node.cdx.json --ignore-npm-errors
      - name: Attach SBOMs and policy artifact to the release
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: gh release create "$GITHUB_REF_NAME" --generate-notes sbom-python.cdx.json sbom-node.cdx.json policy/dist/policy.wasm policy/dist/policy.sha256
