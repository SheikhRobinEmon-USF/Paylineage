packages:
  - packages/*
  - apps/*

# Supply chain cooldown: refuse versions published less than 7 days ago.
minimumReleaseAge: 10080
# Only these packages may run install scripts.
onlyBuiltDependencies:
  - esbuild
  - sharp
  - "@tailwindcss/oxide"
  - unrs-resolver

# typescript-eslint supports TypeScript < 6.1. Keep one TypeScript for typecheck and lint.
overrides:
  typescript: 6.0.3
